services:
  - type: web
    name: blind-nav-yolo-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    plan: starter
    envVars:
      - key: API_KEY
        generateValue: true
      - key: YOLO_MODEL
        value: yolov8n.pt
      - key: ALLOWED_ORIGINS
        value: "*"
